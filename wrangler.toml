name = "brazilianwax-education-v1"
main = "src/worker.ts"
compatibility_date = "2026-07-05"
workers_dev = false
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "force-trailing-slash"
not_found_handling = "404-page"
# Run Worker before asset lookup so www/HTTP redirects always fire
run_worker_first = true

[observability]
enabled = true
